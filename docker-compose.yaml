services:
  postgres:
    image: postgres:16-alpine
    container_name: tak24_nodejs_for_testing
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tak24_nodejs_for_testing
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  
